# Render Blueprint — Sessions Marketplace
# https://render.com/docs/blueprint-spec
#
# This file defines the production infrastructure:
#   - PostgreSQL database
#   - Django backend (web service)
#   - React frontend (static site)
#
# Usage:
#   1. Push this file to origin/main
#   2. Go to https://dashboard.render.com/blueprints
#   3. Connect your GitHub repository
#   4. Set required environment variables
#   5. Deploy

databases:
  - name: sessions-marketplace-db
    plan: free
    databaseName: sessions_marketplace
    user: marketplace_user

services:
  # ── Django Backend ──────────────────────────
  - type: web
    name: sessions-marketplace-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com"
      - key: POSTGRES_DB
        fromDatabase:
          name: sessions-marketplace-db
          property: database
      - key: POSTGRES_USER
        fromDatabase:
          name: sessions-marketplace-db
          property: user
      - key: POSTGRES_PASSWORD
        fromDatabase:
          name: sessions-marketplace-db
          property: password
      - key: POSTGRES_HOST
        fromDatabase:
          name: sessions-marketplace-db
          property: host
      - key: POSTGRES_PORT
        fromDatabase:
          name: sessions-marketplace-db
          property: port
      - key: GITHUB_CLIENT_ID
        sync: false  # Set manually in Render dashboard
      - key: GITHUB_CLIENT_SECRET
        sync: false  # Set manually in Render dashboard
      - key: CREATOR_EMAILS
        sync: false  # Set manually in Render dashboard
      - key: CORS_ALLOWED_ORIGINS
        sync: false  # Set to https://<frontend-url>.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        sync: false  # Set to https://<frontend-url>.onrender.com

  # ── React Frontend ──────────────────────────
  - type: web
    name: sessions-marketplace
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_GITHUB_CLIENT_ID
        sync: false  # Set manually — same as backend GITHUB_CLIENT_ID
      - key: VITE_API_URL
        sync: false  # Set to https://<backend-url>.onrender.com/api
